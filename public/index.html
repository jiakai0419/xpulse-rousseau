<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>xpulse</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <aside class="sidebar" aria-label="Account">
        <div class="x-auth sidebar-account">
          <span id="x-auth-avatar" class="x-auth-avatar" aria-hidden="true" hidden></span>
          <span id="x-auth-status" class="x-auth-status">X not configured</span>
          <a id="x-auth-button" class="auth-button disabled" href="/api/auth/x/start" aria-disabled="true">Connect</a>
        </div>
        <div class="sidebar-ai" aria-label="OpenAI model">
          <span id="ai-status" class="sidebar-ai-status">checking</span>
        </div>
      </aside>

      <section class="timeline" aria-live="polite">
        <header class="topbar">
          <div class="topbar-spacer" aria-hidden="true"></div>
          <div class="top-actions">
            <button id="source-toggle" class="source-toggle offline" type="button" aria-label="Pulse source: Offline" aria-pressed="false">
              <span class="source-toggle-track" aria-hidden="true"><span class="source-toggle-knob"></span></span>
              <span id="source-toggle-label" class="source-toggle-label">Offline</span>
            </button>
            <button id="refresh-button" class="pulse-button" type="button">
              <span class="pulse-button-icon" aria-hidden="true">
                <svg class="pulse-button-glyph" viewBox="0 0 24 24">
                  <path class="pulse-wave-shadow" d="M3 12h4l2.1-5.2 4.3 10.4 2.1-5.2H21" />
                  <path class="pulse-wave" d="M3 12h4l2.1-5.2 4.3 10.4 2.1-5.2H21" />
                </svg>
              </span>
              <span>Pulse</span>
            </button>
          </div>
        </header>

        <div id="status" class="status-live" role="status" aria-live="polite"></div>

        <div id="task-progress" class="task-progress" hidden>
          <div class="task-progress-meta">
            <strong id="task-progress-label">Working</strong>
            <span id="task-progress-elapsed">0s</span>
          </div>
          <div class="task-progress-track" aria-hidden="true">
            <span id="task-progress-bar"></span>
          </div>
          <p id="task-progress-detail">Waiting for server</p>
        </div>
        <div id="usage-panel" class="usage-panel" hidden></div>
        <div id="results" class="results"></div>
      </section>
    </main>

    <div id="media-viewer" class="media-viewer" role="dialog" aria-modal="true" aria-label="Media viewer" hidden>
      <button id="media-viewer-close" class="media-viewer-button media-viewer-close" type="button" aria-label="Close media viewer">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M6 6l12 12M18 6L6 18" />
        </svg>
      </button>
      <button id="media-viewer-prev" class="media-viewer-button media-viewer-nav media-viewer-prev" type="button" aria-label="Previous media" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M15 6l-6 6 6 6" />
        </svg>
      </button>
      <figure class="media-viewer-stage">
        <img id="media-viewer-image" alt="" />
        <video id="media-viewer-video" controls playsinline hidden></video>
        <figcaption id="media-viewer-caption" class="media-viewer-caption" hidden></figcaption>
      </figure>
      <button id="media-viewer-next" class="media-viewer-button media-viewer-nav media-viewer-next" type="button" aria-label="Next media" hidden>
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M9 6l6 6-6 6" />
        </svg>
      </button>
      <span id="media-viewer-counter" class="media-viewer-counter" hidden></span>
    </div>

    <script src="/app.js" type="module"></script>
  </body>
</html>
