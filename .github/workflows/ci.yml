name: CI

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  test:
    name: Unit and environment checks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Environment doctor
        run: npm run doctor

      - name: Unit tests
        run: npm test

      - name: Unit coverage map
        run: npm run test:coverage
